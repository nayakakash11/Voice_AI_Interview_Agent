version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice_ai_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    # This ensures that if you change code, it reloads (optional, good for dev)
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
